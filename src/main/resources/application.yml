server:
  port: 8080
  address: "127.0.0.1"

spring:
  application:
    name: binance-spot-competition-bot
  threads:
    virtual:
      enabled: true

binance:
  api:
    base-url: "https://api.binance.com"
    ws-market-url: "wss://stream.binance.com:9443/ws"
    ws-user-url: "wss://stream.binance.com:9443/ws"
    api-key: "${BINANCE_API_API_KEY:}"
    secret-key: "${BINANCE_API_SECRET_KEY:}"
  strategy:
    # OBSERVE: 只消费公开行情并记录虚拟入场结果，绝不发认证请求或订单。LIVE 必须显式设置。
    execution-mode: "OBSERVE"
    symbol: "PYTHUSDT"
    # 单笔下单金额 (USDT, 建议 $15~$25，化整为零抗单边)
    order-amount-usdt: 20.0
    # 买单挂单深度偏移 (避开买一，挂在 Bid 2 ~ Bid 3 吃插针)
    bid-depth-offset-ticks: 2
    # 卖单挂单深度 (接到货后贴紧卖一快速回本出货)
    ask-depth-offset-ticks: 1
    # 挂单超时时间 (毫秒，超时后跟随最新盘口位移)
    order-ttl-ms: 1200
    # 最小要求盘口点差 (Ticks)
    min-spread-ticks: 2
    # 数量随机扰动比例 (如 0.05 表示 +-5% 随机数量，打破机器人特征)
    random-size-jitter: 0.05
    # 新开仓信号窗口与保护阈值；均应先在 Testnet 回测和验证后调整
    signal-lookback-ms: 3000
    market-data-stale-ms: 1000
    min-book-imbalance: 0.05
    min-depth-imbalance: -0.10
    min-taker-flow-imbalance: -0.20
    max-downward-move-bps: 8
    max-short-term-volatility-bps: 20
    # 检测到主动卖压/短线下跌后，先冷静，再确认价格从低点回收才允许重新挂买单。
    post-selloff-cooldown-ms: 1500
    min-post-selloff-reclaim-bps: 3
    # 生产安全上限：达到任一限制后只允许继续降低已有仓位，禁止新开仓。
    max-inventory-usdt: 40
    max-daily-realized-loss-usdt: 5
    max-daily-drawdown-usdt: 8
    max-inventory-age-ms: 60000
    # 在尚未接入交易所实际 commission 字段前，保守估算 Maker 手续费。
    assumed-maker-fee-bps: 10
    # 观测模式最多每 1.5 秒记录一次候选入场；至少积累 500 个完整 60 秒样本再人工评估。
    paper-entry-interval-ms: 1500
    min-paper-observations: 500

logging:
  level:
    com.binance.bot: INFO
    org.springframework.web: WARN
