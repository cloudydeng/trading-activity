server:
  port: 8080
  address: "127.0.0.1"
  # Trust the protocol headers emitted by the local Nginx HTTPS proxy, so login
  # redirects and Secure session cookies remain on HTTPS.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict

spring:
  application:
    name: binance-spot-competition-bot
  threads:
    virtual:
      enabled: true

binance:
  # Kept outside api.profiles to avoid Spring treating the JSON scalar as a map entry.
  account-profiles-json: '${BOT_ACCOUNT_PROFILES_JSON:}'
  account-profiles-env-file: "${BOT_ACCOUNT_PROFILES_ENV_FILE:/etc/trading-activity.env}"
  storage:
    daily-stats-db: "${BOT_DAILY_STATS_DB:data/daily-stats.db}"
  security:
    admin-token: "${BOT_ADMIN_TOKEN:}"
    admin-password: "${BOT_ADMIN_PASSWORD:}"
  api:
    base-url: "https://api.binance.com"
    ws-market-url: "wss://stream.binance.com:9443/ws"
    ws-user-url: "wss://ws-api.binance.com:443/ws-api/v3"
    api-key-alias: "${BINANCE_API_KEY_ALIAS:unlabeled}"
    api-key: "${BINANCE_API_API_KEY:}"
    secret-key: "${BINANCE_API_SECRET_KEY:}"
  strategy:
    # 系统只有 LIVE 运行模式；服务器开关默认关闭，避免误启动真实交易。
    live-trading-enabled: "${BINANCE_LIVE_TRADING_ENABLED:false}"
    symbol: "${BINANCE_STRATEGY_SYMBOL:ENSOUSDT}"
    # 单笔名义金额；ENSOUSDT 的 Binance 最小名义额为 5 USDT。
    order-amount-usdt: 12.0
    # 控制台可配置的单笔 LIVE 金额上限；现有账户金额不会因此自动放大。
    max-live-order-notional-usdt: 30.0
    # 默认买一；BID_ASK_MAKER 可在账户/交易对配置中选择买一至买五。
    # LIMIT_MAKER 仍会阻止意外 Taker 成交。
    bid-depth-offset-ticks: 0
    # 旧版盘口偏移配置；当前三种策略的初始卖价不读取该字段。
    ask-depth-offset-ticks: 0
    # 挂单超时时间 (毫秒，超时后跟随最新盘口位移)
    order-ttl-ms: 20000
    # 每张卖单管理 2 分钟；超时撤单对账后，将剩余持仓按最新卖一价重新挂 LIMIT GTC。
    limit-sell-timeout-ms: 120000
    # 仅作为兼容配置；买单现在固定驻留至 20 秒 TTL，不再因短线信号撤单。
    min-entry-order-rest-ms: 800
    # 买入只允许 Maker；20 秒后若仍在策略配置档位则继续挂，否则撤单，不追卖一、不转 IOC。
    # 默认每笔 12U，可按账户/交易对配置但不得超过 30U；数量仅按 stepSize 向下取整。
    random-size-jitter: 0
    # 以下行情参数继续用于原始技术数据和兼容评估器；当前三种策略不会据此阻断买一 Maker 入场。
    signal-lookback-ms: 3000
    market-data-stale-ms: 1000
    # 五档深度流可能短暂无变化；独立放宽，避免 1 秒边界抖动误撤 Maker 买单。
    depth-data-stale-ms: 2500
    # 兼容评估器的盘口名义额阈值；当前三种策略仅展示，不作为入场门槛。
    min-top-book-notional-multiplier: 1.0
    min-depth-notional-multiplier: 1.0
    # 连接存活与下单行情新鲜度分离：Binance 约每 20 秒发 Ping，45 秒无任何入站帧才重连。
    market-stream-watchdog-ms: 45000
    # 以下买卖力量、成交流、跌幅和波动阈值仅用于兼容评估/诊断，不阻断当前策略入场。
    min-book-imbalance: -0.35
    # 3 秒窗口至少 3 笔成交才判断主动买卖方向，避免单笔小卖单把指标打到 -1。
    min-taker-flow-samples: 3
    min-taker-flow-imbalance: -0.20
    max-downward-move-bps: 8
    max-short-term-volatility-bps: 20
    # 旧版下跌冷却参数，当前三种策略不使用它阻断买入。
    post-selloff-cooldown-ms: 1500
    min-post-selloff-reclaim-bps: 3
    # 生产安全上限：达到任一限制后只允许继续降低已有仓位，禁止新开仓。
    max-inventory-usdt: 40
    # 可由受保护环境文件中的 BINANCE_STRATEGY_MAX_DAILY_DRAWDOWN_USDT 覆盖。
    max-daily-drawdown-usdt: "${BINANCE_STRATEGY_MAX_DAILY_DRAWDOWN_USDT:8}"
    max-inventory-age-ms: 600000
    # 以下三个字段仅为旧配置兼容；当前策略不使用利润目标或 15 秒阶梯改价。
    take-profit-bps: 10
    exit-reprice-after-ms: 15000
    exit-reprice-interval-ms: 5000
    # 仅用于下单前的风险估算；成交后由 executionReport/myTrades 的真实 commission 覆盖记账。
    assumed-maker-fee-bps: 10
    # 残余库存必须高于交易所最小名义额 5% 才重新合并卖出，避免贴边被过滤器拒单。
    sell-min-notional-buffer-percent: 5
    # 粉尘库存超过该 USDT 名义额说明异常，停止继续买入等待人工处理。
    max-dust-notional-usdt: 20
    # 可选记录真实成交后的行情结果，仅用于诊断，不参与 LIVE 启动和下单判断。
    collect-observations: false
    # 每个交易对单独留存成交后结果，防止切换交易对后混入旧样本。
    observation-output-file: "data/enso-paper-outcomes.jsonl"

logging:
  level:
    com.binance.bot: INFO
    org.springframework.web: WARN
