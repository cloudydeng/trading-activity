<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账户与成交 - Trading Activity</title>
<style>
:root{color-scheme:dark}body{font-family:system-ui,-apple-system,sans-serif;max-width:1180px;margin:28px auto;padding:0 18px;background:#101827;color:#e5e7eb}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}a{color:#93c5fd}button{padding:9px 13px;border:0;border-radius:7px;font-size:14px;cursor:pointer;background:#334155;color:#fff}.muted{color:#a5b4c7;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:18px 0}.card,section{background:#172033;border:1px solid #28364e;border-radius:10px;padding:15px}.label{color:#9aabc2;font-size:13px}.value{font-size:21px;font-weight:650;margin-top:6px}.ok{color:#4ade80}.bad{color:#fb7185}section{margin-top:12px;overflow:auto}h1{font-size:23px}h2{font-size:16px;margin:0 0 12px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:9px 10px;border-bottom:1px solid #28364e;text-align:left;font-size:13px}th{color:#9aabc2;font-weight:500}.empty{color:#9aabc2;padding:12px 0}.error{color:#fb7185}
</style></head>
<body><div class="head"><div><h1>账户与成交</h1><div id="updated" class="muted">正在加载…</div></div><p><a href="/dashboard.html">返回控制台</a> <button onclick="load()">立即刷新</button> <form method="post" action="/logout" style="display:inline"><button>退出登录</button></form></p></div>
<div class="grid" id="summary"></div>
<section><h2>非零余额</h2><table><thead><tr><th>资产</th><th>可用</th><th>冻结</th><th>合计</th></tr></thead><tbody id="balances"></tbody></table></section>
<section id="trades"><h2>已成交订单（最近 100 条订单中有成交的记录）</h2><p class="muted">一次闭环表示一笔买入仓位已经全部卖完；MARKET 订单显示成交额 ÷ 成交数量计算出的实际成交均价。</p><table><thead><tr><th>时间</th><th>订单号</th><th>方向</th><th>类型</th><th>状态</th><th>成交均价</th><th>成交数量</th><th>成交额</th></tr></thead><tbody id="filled"></tbody></table></section>
<section><h2>当前活动订单</h2><table><thead><tr><th>时间</th><th>订单号</th><th>方向</th><th>类型</th><th>状态</th><th>价格</th><th>原始数量</th><th>已成交</th></tr></thead><tbody id="open"></tbody></table></section>
<script>
const n=v=>v===null||v===undefined?'—':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:8});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const empty=(id,text)=>document.querySelector(id).innerHTML=`<tr><td colspan="8" class="empty">${text}</td></tr>`;
function orderRows(rows,filled){if(!rows.length){empty(filled?'#filled':'#open','暂无记录');return}document.querySelector(filled?'#filled':'#open').innerHTML=rows.map(o=>{const time=o.timeMs?new Date(o.timeMs).toLocaleString('zh-CN'):'—';return filled?`<tr><td>${time}</td><td>${esc(o.orderId)}</td><td>${esc(o.side)}</td><td>${esc(o.type)}</td><td>${esc(o.status)}</td><td>${n(o.price)}</td><td>${n(o.executedQty)}</td><td>${n(o.quoteQty)}</td></tr>`:`<tr><td>${time}</td><td>${esc(o.orderId)}</td><td>${esc(o.side)}</td><td>${esc(o.type)}</td><td>${esc(o.status)}</td><td>${n(o.price)}</td><td>${n(o.originalQty)}</td><td>${n(o.executedQty)}</td></tr>`}).join('')}
async function load(){try{const r=await fetch('/api/bot/account',{cache:'no-store'});if(r.status===401){location='/login.html';return}if(!r.ok)throw Error(r.status);const s=await r.json();document.querySelector('#summary').innerHTML=[['API Key 别名',esc(s.apiKeyAlias||'unlabeled')],['交易对',s.symbol],['账户类型',s.accountType],['可交易',s.canTrade?'<span class="ok">是</span>':'<span class="bad">否</span>'],['非零资产',s.balances.length],['已成交订单',s.filledOrders.length],['活动订单',s.openOrders.length]].map(([k,v])=>`<div class="card"><div class="label">${k}</div><div class="value">${v}</div></div>`).join('');document.querySelector('#balances').innerHTML=s.balances.length?s.balances.map(b=>`<tr><td>${esc(b.asset)}</td><td>${n(b.free)}</td><td>${n(b.locked)}</td><td>${n(b.total)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">暂无非零余额</td></tr>';orderRows(s.filledOrders,true);orderRows(s.openOrders,false);document.querySelector('#updated').textContent=`自动刷新：每 10 秒一次 · 上次更新 ${new Date().toLocaleTimeString('zh-CN')}`}catch(e){document.querySelector('#updated').innerHTML=`<span class="error">读取失败：${esc(e.message)}，将自动重试</span>`}}load();setInterval(load,10000);
</script></body></html>
