<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Activity 控制台</title>
<style>body{font-family:system-ui;max-width:900px;margin:32px auto;padding:20px;background:#101827;color:#e5e7eb}button{padding:10px 14px;margin-right:8px;border:0;border-radius:6px}pre{background:#172033;padding:16px;overflow:auto}.start{background:#16a34a;color:white}.stop{background:#dc2626;color:white}</style></head>
<body><h2>Trading Activity 控制台</h2><p><button class="start" onclick="control('start')">启动</button><button class="stop" onclick="control('stop')">停止</button><form method="post" action="/logout" style="display:inline"><button>退出登录</button></form></p><pre id="status">加载中…</pre>
<script>async function status(){let r=await fetch('/api/bot/status');if(r.status===401){location='/login.html';return}document.querySelector('#status').textContent=JSON.stringify(await r.json(),null,2)}async function control(x){if(!confirm('确认'+(x==='start'?'启动':'停止')+'？'))return;let r=await fetch('/api/bot/'+x,{method:'POST'});if(!r.ok)alert('操作失败：'+r.status);await status()}status();setInterval(status,5000)</script></body></html>
