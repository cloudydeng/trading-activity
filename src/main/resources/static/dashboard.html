<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Activity 控制台</title>
<style>
:root{color-scheme:dark}body{font-family:system-ui,-apple-system,sans-serif;max-width:1080px;margin:28px auto;padding:0 18px;background:#101827;color:#e5e7eb}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}button{padding:9px 13px;border:0;border-radius:7px;font-size:14px;cursor:pointer}.start{background:#16a34a;color:#fff}.stop{background:#dc2626;color:#fff}.muted{color:#a5b4c7;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:18px 0}.card{background:#172033;border:1px solid #28364e;border-radius:10px;padding:15px}.card-link{display:block;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}.card-link:hover{border-color:#60a5fa;transform:translateY(-1px)}.card-link .label::after{content:' · 查看详情';color:#93c5fd}.label{color:#9aabc2;font-size:13px}.value{font-size:21px;font-weight:650;margin-top:6px}.ok{color:#4ade80}.warn{color:#fbbf24}.bad{color:#fb7185}section{background:#172033;border:1px solid #28364e;border-radius:10px;padding:16px;margin-top:12px}h1{font-size:23px}h2{font-size:16px;margin:0 0 12px}dl{display:grid;grid-template-columns:max-content 1fr;gap:9px 16px;margin:0}dt{color:#9aabc2}dd{margin:0;word-break:break-word}details{margin-top:14px}pre{white-space:pre-wrap;overflow:auto;background:#0d1422;padding:12px;border-radius:7px;font-size:12px}.error{color:#fb7185}
</style></head>
<body><div class="head"><div><h1>Trading Activity 控制台</h1><div id="updated" class="muted">正在加载…</div></div><p><a id="accountLink" href="/account.html">账户与成交</a> <a href="/volume.html">API 账户10天汇总</a> <button onclick="reloadAccounts()">热加载账户</button><button class="bad" onclick="armLive()">解锁当前 LIVE</button><button class="start" onclick="control('start')">启动当前</button><button class="stop" onclick="control('stop')">停止当前</button><button class="bad" onclick="controlAll('arm-all')">解锁全部 LIVE</button><button class="start" onclick="controlAll('start-all')">启动全部</button><button class="stop" onclick="controlAll('stop-all')">停止全部</button><form method="post" action="/logout" style="display:inline"><button>退出登录</button></form></p></div>
<div class="grid" id="summary"></div>
<section><h2>账号运行实例</h2><p class="muted">每个账号独立运行；这里只选择要查看和控制的实例，不会切换或共享凭据。</p><select id="accountSelect" onchange="selectAccount()" style="padding:9px;border-radius:7px;border:1px solid #40506a;background:#0d1422;color:#e5edf8"></select></section>
<section><h2>切换交易对</h2><p class="muted">仅支持 USDT 现货。必须先停止并解除 LIVE；系统会确认旧/新交易对无挂单且无标的库存。</p><input id="symbolInput" maxlength="20" placeholder="例如 BTCUSDT" style="padding:9px;border-radius:7px;border:1px solid #40506a;background:#0d1422;color:#e5edf8;text-transform:uppercase"><button onclick="switchSymbol()">安全切换</button></section>
<section><h2>当前入场判断</h2><dl id="signal"></dl></section>
<section><h2>风险与仓位</h2><dl id="risk"></dl></section>
<details><summary>查看原始技术数据</summary><pre id="raw">加载中…</pre></details>
<script>
const reasonMap={BEST_BID_MAKER:'固定策略：买一价挂 Maker 买单',ALLOWED:'条件通过，可以入场',AWAITING_MARKET_DATA:'等待行情数据',STALE_MARKET_DATA:'最优盘口数据过期',STALE_DEPTH_DATA:'深度数据过期',INSUFFICIENT_SIGNAL_HISTORY:'信号历史不足',EMPTY_TOP_OF_BOOK:'买一卖一数量为空',EMPTY_DEPTH_BOOK:'多档深度为空',WEAK_TOP_OF_BOOK:'买一力量不足',WEAK_MULTI_LEVEL_BIDS:'多档买盘力量不足',SELL_TAKER_PRESSURE:'主动卖盘压力过强',MICROPRICE_NOT_SUPPORTIVE:'微观价格不支持买入',SHORT_TERM_DOWNMOVE:'短线仍在下跌',EXCESS_SHORT_TERM_VOLATILITY:'短时波动过大',POST_SELLOFF_COOLDOWN:'下跌后仍在冷却期',WAIT_FOR_PRICE_RECLAIM:'下跌后尚未收复'};
const n=v=>v===null||v===undefined?'—':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:4});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bps=v=>v===null||v===undefined?'—':`${n(v)} bps`;
const pct=v=>v===null||v===undefined?'—':`${n(Number(v)*100)}%`;
const set=(id,items)=>document.querySelector(id).innerHTML=items.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');
let selectedAccountId='';
function render(s){const e=s.entrySignal||{},r=s.risk||{},m=s.marketData||{},a=s.accounting||{},d=s.dailyStats||{};const observing=s.executionMode==='OBSERVE';const age=m.updatedAtMs?Math.max(0,Date.now()-m.updatedAtMs):null;
 document.querySelector('#summary').innerHTML=[['账号',`${esc(s.apiKeyAlias)} (${esc(s.accountId)})`,''],['策略状态',s.status||'—',s.status==='HALTED'?'bad':s.status==='IDLE'?'ok':'warn'],['运行状态',s.running?'运行中':'已停止',s.running?'ok':'warn'],['账户成交流',s.accountStreamReady?'正常':'断开',s.accountStreamReady?'ok':'bad'],['运行模式',observing?'仅观察（不下单）':s.executionMode,observing?'ok':'bad'],['策略类型',s.strategyMode||'CURRENT',''],['LIVE 解锁',s.liveArmed?'已解锁':'已锁定',s.liveArmed?'bad':'ok'],['交易对',s.symbol||'—',''],['当前单笔金额（USDT）',n(s.orderAmountUsdt),''],['共享 IP API 权重',`${n(s.usedApiWeight1m)} / ${n(s.apiWeightEntrySafeLimit1m)}（上限 ${n(s.apiWeightLimit1m)}）`,Number(s.usedApiWeight1m)>=Number(s.apiWeightEntrySafeLimit1m)?'warn':'ok'],['今日真实成交量（USDT）',n(d.totalVolumeQuote),''],['今日真实手续费（USDT）',n(d.totalCommissionQuoteEquivalent),d.commissionConversionComplete===false?'warn':''],['今日已实现净盈亏',n(d.netRealizedPnlQuote),Number(d.netRealizedPnlQuote)<0?'bad':'ok'],['今日闭环次数',n(d.roundTrips),'',`/account.html?accountId=${encodeURIComponent(s.accountId)}#trades`],['每百万成交量成本',d.costPerMillionVolume===null||d.costPerMillionVolume===undefined?'手续费待换算':n(d.costPerMillionVolume),''],['实时中间价',n(m.midPrice),''],['行情延迟',age===null?'等待行情':`${age} ms`,age!==null&&age<3000?'ok':'warn']].map(([k,v,c,href])=>href?`<a class="card card-link" href="${href}" title="查看构成闭环的买卖成交订单"><div class="label">${k}</div><div class="value ${c}">${v}</div></a>`:`<div class="card"><div class="label">${k}</div><div class="value ${c}">${v}</div></div>`).join('');
 set('#risk',[['当前状态说明',s.statusReason||'—'],['新开仓限制',r.entryBlockReason||'<span class="ok">无</span>'],['持仓数量',n(r.positionQty)],['持仓成本（USDT）',n(r.positionCostUsdt)],['标记价格',n(r.markPrice)],['已实现盈亏（USDT）',n(r.realizedPnlUsdt)],['浮动盈亏（USDT）',n(r.unrealizedPnlUsdt)],['预估净盈亏（含手续费）',n(r.estimatedNetPnlUsdt)],['预估手续费（USDT）',n(r.estimatedFeesUsdt)]]);
 set('#signal',[['是否允许入场',e.allowed?'<span class="ok">允许</span>':'<span class="warn">暂不入场</span>'],['原因',reasonMap[e.reason]||e.reason||'—'],['盘口买卖力量差',pct(e.bookImbalance)],['深度买卖力量差',pct(e.depthImbalance)],['主动成交买卖差',pct(e.takerFlowImbalance)],['短期价格变化',bps(e.returnBps)],['短期波动范围',bps(e.rangeBps)]]);
 document.querySelector('#raw').textContent=JSON.stringify(s,null,2);document.querySelector('#updated').textContent=`自动刷新：每 1 秒一次 · 上次更新 ${new Date().toLocaleTimeString('zh-CN')}`;
}
async function loadAccounts(){const r=await fetch('/api/accounts',{cache:'no-store'});if(r.status===401){location='/login.html';return}const accounts=await r.json();const usable=accounts.filter(a=>a.initialized);const select=document.querySelector('#accountSelect');const old=selectedAccountId;select.innerHTML=usable.map(a=>`<option value="${esc(a.accountId)}">${esc(a.alias)} (${esc(a.accountId)})</option>`).join('');selectedAccountId=usable.some(a=>a.accountId===old)?old:(usable[0]?.accountId||'');select.value=selectedAccountId;selectAccount()}
function selectAccount(){selectedAccountId=document.querySelector('#accountSelect').value;document.querySelector('#accountLink').href=`/account.html?accountId=${encodeURIComponent(selectedAccountId)}`;status()}
async function status(){if(!selectedAccountId)return;try{const r=await fetch(`/api/accounts/${encodeURIComponent(selectedAccountId)}/status`,{cache:'no-store'});if(r.status===401){location='/login.html';return}if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){document.querySelector('#updated').innerHTML=`<span class="error">状态读取失败：${e.message}，将自动重试</span>`}}
async function armLive(){const r=await fetch(`/api/accounts/${encodeURIComponent(selectedAccountId)}/live/arm`,{method:'POST'});alert(await r.text());await status()}
async function switchSymbol(){const input=document.querySelector('#symbolInput');const symbol=input.value.trim().toUpperCase();if(!symbol){alert('请输入交易对，例如 BTCUSDT');return}if(!confirm(`确认当前账号安全切换到 ${symbol}？策略必须保持停止。`))return;const r=await fetch(`/api/accounts/${encodeURIComponent(selectedAccountId)}/symbol`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol})});const body=await r.json();alert(body.message||'切换完成');if(r.ok)input.value='';await status()}
async function control(x){if(!confirm(`确认${x==='start'?'启动当前账号（LIVE 解锁时会真实下单）':'停止当前账号并解除 LIVE'}？`))return;const r=await fetch(`/api/accounts/${encodeURIComponent(selectedAccountId)}/${x}`,{method:'POST'});alert(await r.text());await status()}
async function controlAll(x){const action=x==='arm-all'?'为全部账号解锁 LIVE（下一步启动后会真实下单）':x==='start-all'?'启动全部已解锁账号':'停止全部账号并解除 LIVE';if(!confirm(`确认${action}？`))return;const r=await fetch('/api/accounts/'+x,{method:'POST'});const body=await r.json();alert(Object.entries(body).map(([id,v])=>`${id}: ${v.success?'成功':'失败'}${v.reason?' · '+v.reason:''}`).join('\n'));await loadAccounts()}
async function reloadAccounts(){if(!confirm('从服务器受保护环境文件热加载新增账户？现有账户、SELL 单和 LIVE 状态不会改变。'))return;const r=await fetch('/api/accounts/reload',{method:'POST'});const body=await r.json();if(!r.ok){alert(body.message||'热加载失败');return}const added=(body.addedAccounts||[]).join(', ')||'无新增账户';const errors=Object.entries(body.errors||{}).map(([id,v])=>`${id}: ${v}`).join('\n');alert(`新增：${added}${errors?'\n失败：\n'+errors:''}`);await loadAccounts()}loadAccounts();setInterval(status,1000);
</script></body></html>
