<html lang="zh-CN" data-page-node-id="BlK1bhWBx5BCMJzkS2nVoI"><head data-page-node-id="OZJkHS7GVFAZG4Vs71bxQr"><meta charset="utf-8" data-page-node-id="1H94nsP1WDUmJUyoZIaFLs"><meta name="viewport" content="width=device-width,initial-scale=1" data-page-node-id="RwXPdxakXPgzmJGTUvSFzB"><title>成交明细查询 - Trading Activity</title>
<style>
:root{color-scheme:dark}body{font-family:system-ui,-apple-system,sans-serif;max-width:1320px;margin:28px auto;padding:0 18px;background:#101827;color:#e5e7eb}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}a{color:#93c5fd}button{padding:9px 13px;border:0;border-radius:7px;font-size:14px;cursor:pointer;background:#334155;color:#fff}.muted{color:#a5b4c7;font-size:14px}section{background:#172033;border:1px solid #28364e;border-radius:10px;padding:16px;margin-top:14px;overflow:auto}.ok{color:#4ade80}.bad{color:#fb7185}h1{font-size:23px}h2{font-size:16px;margin:0 0 12px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px;border-bottom:1px solid #28364e;text-align:left;font-size:13px}th{color:#9aabc2;font-weight:500}.empty{color:#9aabc2;padding:16px 0}.error{color:#fb7185}.filters{display:flex;align-items:center;gap:10px;margin:12px 0 14px;flex-wrap:wrap}.flabel{color:#cbd5e1;font-size:14px}.filters label{color:#cbd5e1;font-size:14px}.filters input{min-width:150px;padding:8px 10px;border:1px solid #3b4b66;border-radius:7px;background:#101827;color:#e5e7eb;font-size:14px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 11px;border:1px solid #3b4b66;border-radius:999px;background:#101827;color:#cbd5e1;font-size:13px;cursor:pointer}.chip.on{background:#2563eb;border-color:#2563eb;color:#fff}.mini{padding:6px 11px;font-size:13px}.quick{display:flex;gap:8px}button.on{background:#2563eb}

<body data-page-node-id="AUzoo7RBZyU8AC3EnJYd7J"><div class="head" data-page-node-id="8d9waVGBgj2qwkvj3ptLqg"><div data-page-node-id="JkWNYhHVRPwWKpnE1kGdvJ"><h1 data-page-node-id="QSXTc1psIaraWatJg3SLDU">成交明细查询</h1><div id="updated" class="muted" data-page-node-id="ng4ZGNayHoiW36ZsiacJ5T">正在加载…</div></div><p data-page-node-id="xQsBL3MoS7TvIxL75xo2Gu"><a href="/dashboard.html" data-page-node-id="aDb3tM1vFKNRHWiHW72EQm">返回控制台</a> <a href="/today.html" data-page-node-id="kfb4BGpWaw2ulHWKjidSDm">今日账户汇总</a> <a href="/volume.html" data-page-node-id="rFjDxtgDg7pARmPWSWo3jP">账户成交量汇总</a> <button onclick="load()" data-page-node-id="vFGr2rqqdfGemlEUkjywkT">立即刷新</button></p></div>
<section data-page-node-id="fxjKOCxIpKr8VsUcihdmRP"><h2 data-page-node-id="nFsiEouXcUYT3ZLdUQRiUD">按币种与时间查询每笔成交（UTC）</h2><p class="muted" data-page-node-id="M9HM7fwWOPhGdtpZuhm0Kt">每一行是一笔真实成交。币种可多选，一个都不选表示全部币种。成交明细只保留当前 UTC 日及前 <span id="keepDays" data-page-node-id="LKRmsM1e5BUi8iLAUj4wWF"></span> 个 UTC 日，更早的记录会被自动清理；单次最多返回 <span id="rowLimit" data-page-node-id="lCmeohCMYmeZImrZGwaq1s"></span> 笔。页面只显示账户别名和 ID，不显示 API Key 或 Secret。</p>
<div class="filters" data-page-node-id="QM4dtaAl80uixdW7dfn7rW"><span class="flabel" data-page-node-id="BEHTDEdGp53TS6GMEcVBU6">币种</span><div id="symbolChips" class="chips" data-page-node-id="tMWULSuK6FEzPHJWJQpOar"></div><button class="mini" onclick="clearSymbols()" data-page-node-id="OFryIDFHfmg6KkSJr0JZoq">全部币种</button><button class="mini" onclick="selectAllSymbols()" data-page-node-id="iMBvhBjESwVcId2eMTZ7RS">全选</button><span id="selInfo" class="muted" data-page-node-id="gqDRUsfVdXy3S8tOOaxVqg"></span></div>
<div class="filters" data-page-node-id="TpQ59QbWwLVsUXXHkJZZax"><div class="quick" data-page-node-id="apoNCvWIcd5ryu8EHleYI3"><button id="q1" onclick="quick(1)" data-page-node-id="9SZ5FdFuY4NHfc6xD3FgjY">今天</button><button id="q3" onclick="quick(3)" data-page-node-id="aUCcWdF1V0Q1E4bE7j91cU">近 3 天</button><button id="q7" onclick="quick(7)" data-page-node-id="sJkBLO6QF2g7PUDC8kArcB">近 7 天</button><button id="q10" onclick="quick(10)" data-page-node-id="SWd3ZFgPQrcgl3KzY5zvMx">近 10 天</button></div><label for="fromDate" data-page-node-id="CwKjwMkFcItE1DMAINAQuU">起始</label><input type="date" id="fromDate" onchange="onDate()" data-page-node-id="joc0I2AgxQIAmOfB7j0yaK"><label for="toDate" data-page-node-id="hbhesQb9hoz9xGcm4BteHO">结束</label><input type="date" id="toDate" onchange="onDate()" data-page-node-id="WCSkRztKuhzjw6mwDApTqo"></div>
<table data-page-node-id="BOaDMQ4JUVZqJaia7dJvG8"><thead data-page-node-id="JYBYMeEPDAUFXgMPtkehjh"><tr data-page-node-id="0DuKjLBl5G1N2LgJAb8WXe"><th data-page-node-id="Je08clhhfrsmeQo2jD60sI">成交时间（UTC）</th><th data-page-node-id="Of7mrqOB0ZfgxVuDlOPRR5">API 账户</th><th data-page-node-id="SFiDA4TXslmD6W7ydgnzEx">交易对</th><th data-page-node-id="jJ40ui9Ku2S9SgMkTIBidI">方向</th><th data-page-node-id="mGR2eJKkFrBX4Apf8ehE73">价格</th><th data-page-node-id="j1nnd5CxlqAgtd1oasMUok">数量</th><th data-page-node-id="4qHVcZiTfLDipDcWIdnfHl">金额（USDT）</th><th data-page-node-id="cHpEra6iPZCC9p5EHCkrr1">手续费</th></tr></thead><tbody id="rows" data-page-node-id="BZ9HxXLZn7eJorrP8HCiAA"></tbody></table></section>
<script>
const KEEP=10, LIMIT=2000;
const n=v=>v===null||v===undefined?'—':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:8});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const utcDay=ms=>new Date(ms).toISOString().slice(0,10);
const utcClock=ms=>new Date(ms).toISOString().slice(0,19).replace('T',' ');
const today=()=>utcDay(Date.now());
const shift=d=>utcDay(Date.now()-d*86400000);
document.querySelector('#keepDays').textContent=KEEP-1;
document.querySelector('#rowLimit').textContent=LIMIT;
let symbols=[],selected=new Set();
function syncSymbols(list){symbols=[...new Set(list.map(s=>s.symbol).filter(Boolean))].sort((a,b)=>a.localeCompare(b));[...selected].forEach(s=>{if(!symbols.includes(s))selected.delete(s)});renderChips()}
function renderChips(){document.querySelector('#symbolChips').innerHTML=symbols.length?symbols.map(s=>`<button class="chip${selected.has(s)?' on':''}" onclick="toggleSymbol('${esc(s)}')">${esc(s)}</button>`).join(''):'<span class="muted">近 10 天暂无成交</span>';document.querySelector('#selInfo').textContent=selected.size?`已选 ${selected.size} 个币种`:'未筛选（全部币种）'}
function toggleSymbol(s){if(selected.has(s))selected.delete(s);else selected.add(s);renderChips();load()}
function clearSymbols(){selected.clear();renderChips();load()}
function selectAllSymbols(){symbols.forEach(s=>selected.add(s));renderChips();load()}
function daysBetween(a,b){return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000)+1}
function markQuick(){const from=document.querySelector('#fromDate').value,to=document.querySelector('#toDate').value;const d=(from&&to)?daysBetween(from,to):0;[1,3,7,10].forEach(v=>document.querySelector('#q'+v).classList.toggle('on',d===v))}
function onDate(){let from=document.querySelector('#fromDate').value,to=document.querySelector('#toDate').value;if(!from)from=shift(KEEP-1);if(!to)to=today();if(from>to){const t=from;from=to;to=t}document.querySelector('#fromDate').value=from;document.querySelector('#toDate').value=to;load()}
function quick(days){document.querySelector('#fromDate').value=shift(days-1);document.querySelector('#toDate').value=today();load()}
async function loadSymbols(){try{const r=await fetch('/api/accounts/stats/summary?days='+KEEP,{cache:'no-store'});if(r.ok)syncSymbols(await r.json())}catch(e){}}
function render(fills){const rows=document.querySelector('#rows');if(!fills.length){rows.innerHTML='<tr><td colspan="8" class="empty">该筛选条件下暂无成交明细</td></tr>';return}rows.innerHTML=fills.map(f=>`<tr><td>${esc(utcClock(f.tradeTimeMs))}</td><td>${esc(f.accountAlias)}<br><span class="muted">${esc(f.accountId)}</span></td><td>${esc(f.symbol)}</td><td class="${f.side==='BUY'?'ok':'bad'}">${f.side==='BUY'?'买入':'卖出'}</td><td>${n(f.price)}</td><td>${n(f.quantity)}</td><td>${n(f.quoteQuantity)}</td><td>${n(f.commission)} ${esc(f.commissionAsset||'')}</td></tr>`).join('')+(fills.length>=LIMIT?`<tr><td colspan="8" class="muted">仅显示最近 ${LIMIT} 笔，请缩小时间范围或少选几个币种</td></tr>`:'')}
async function load(){const from=document.querySelector('#fromDate').value||shift(KEEP-1);const to=document.querySelector('#toDate').value||today();document.querySelector('#fromDate').max=today();document.querySelector('#toDate').max=today();document.querySelector('#fromDate').min=shift(KEEP-1);document.querySelector('#toDate').min=shift(KEEP-1);markQuick();try{const q=new URLSearchParams({from,to});selected.forEach(s=>q.append('symbol',s));const r=await fetch('/api/accounts/stats/fills?'+q,{cache:'no-store'});if(r.status===401){location='/login.html';return}if(!r.ok)throw Error(r.status);const fills=await r.json();render(Array.isArray(fills)?fills:[]);document.querySelector('#updated').textContent=`${from} ~ ${to}（UTC）· 共 ${fills.length} 笔 · 自动刷新每 15 秒 · 上次更新 ${new Date().toLocaleTimeString('zh-CN')}`}catch(e){document.querySelector('#updated').innerHTML=`<span class="error">读取失败：${esc(e.message)}，将自动重试</span>`}}
(async function init(){await loadSymbols();quick(1)})();
setInterval(()=>{load();loadSymbols()},15000);
</script></body></html>
