<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日账户交易汇总 - Trading Activity</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;max-width:1380px;margin:28px auto;padding:0 18px;background:#101827;color:#e5e7eb}.head,.account-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}a{color:#93c5fd}button{padding:9px 13px;border:0;border-radius:7px;font-size:14px;cursor:pointer;background:#334155;color:#fff}.muted{color:#a5b4c7;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:18px 0}.card,.account{background:#172033;border:1px solid #28364e;border-radius:10px;padding:16px}.label{color:#9aabc2;font-size:13px}.value{font-size:22px;font-weight:700;margin-top:6px}.ok{color:#4ade80}.bad,.error{color:#fb7185}.warn{color:#fbbf24}.accounts{display:flex;flex-direction:column;gap:14px}.account h2{font-size:18px;margin:0}.account-id{font-size:12px;color:#8494aa;margin-top:4px}.account-totals{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}.account-totals strong{font-variant-numeric:tabular-nums}.table-wrap{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px;border-bottom:1px solid #28364e;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}th{color:#9aabc2;font-weight:500}.empty{padding:15px 0;color:#9aabc2}.account-error{margin-top:12px;border:1px solid #7f1d1d;background:#2a1720;border-radius:8px;padding:10px}.pnl{font-weight:700}@media(max-width:700px){body{margin-top:16px}.account-totals{display:grid;grid-template-columns:1fr 1fr;gap:8px}.value{font-size:19px}}
</style></head>
<body><div class="head"><div><h1>今日账户交易汇总</h1><div id="updated" class="muted">正在加载…</div></div><p><a href="/dashboard.html">返回控制台</a> <a href="/volume.html">近 10 天汇总</a> <button onclick="load()">立即刷新</button></p></div>
<p class="muted">按 UTC 自然日统计，每个账户列出今天实际交易过的币种；盈亏为已实现净盈亏。数据读取本地每日聚合，不会额外占用 Binance API 权重。</p>
<div class="grid"><div class="card"><div class="label">今日总成交量（USDT）</div><div id="totalVolume" class="value">—</div></div><div class="card"><div class="label">今日总手续费（USDT）</div><div id="totalFee" class="value">—</div></div><div class="card"><div class="label">今日已实现净盈亏（USDT）</div><div id="totalPnl" class="value">—</div></div><div class="card"><div class="label">亏损账户合计（USDT）</div><div id="totalLoss" class="value bad">—</div></div></div>
<main id="accounts" class="accounts"><div class="account muted">正在读取今日汇总…</div></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const amount=v=>v===null||v===undefined?'—':Number(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:6});
function pnl(value){const n=Number(value||0);if(n<0)return {text:`亏损 ${amount(-n)}`,cls:'bad'};if(n>0)return {text:`盈利 ${amount(n)}`,cls:'ok'};return {text:'持平 0.00',cls:''}}
function symbolRows(rows){if(!rows?.length)return '<div class="empty">今日暂无成交</div>';return `<div class="table-wrap"><table><thead><tr><th>币种 / 交易对</th><th>买入量</th><th>卖出量</th><th>总成交量</th><th>手续费</th><th>已实现净盈亏</th></tr></thead><tbody>${rows.map(s=>{const p=pnl(s.netRealizedPnlQuote);return `<tr><td>${esc(s.symbol)}</td><td>${amount(s.buyVolumeQuote)}</td><td>${amount(s.sellVolumeQuote)}</td><td>${amount(s.totalVolumeQuote)}</td><td>${amount(s.totalCommissionQuoteEquivalent)}${s.commissionConversionComplete===false?' <span class="warn" title="部分手续费尚未完成 USDT 换算">*</span>':''}</td><td class="pnl ${p.cls}">${p.text}</td></tr>`}).join('')}</tbody></table></div>`}
function accountHtml(a){const p=pnl(a.netRealizedPnlQuote);return `<section class="account"><div class="account-head"><div><h2>${esc(a.accountAlias||a.accountId)}</h2><div class="account-id">${esc(a.accountId)}</div></div><div class="account-totals"><span>成交量 <strong>${amount(a.totalVolumeQuote)}</strong></span><span>手续费 <strong>${amount(a.totalCommissionQuoteEquivalent)}</strong></span><span class="${p.cls}">${p.text}</span></div></div>${a.error?`<div class="account-error error">${esc(a.error)}，其他账户不受影响</div>`:symbolRows(a.symbols)}</section>`}
function render(data){document.querySelector('#totalVolume').textContent=amount(data.totalVolumeQuote);document.querySelector('#totalFee').textContent=amount(data.totalCommissionQuoteEquivalent);const p=pnl(data.netRealizedPnlQuote),pnlBox=document.querySelector('#totalPnl');pnlBox.textContent=p.text;pnlBox.className=`value ${p.cls}`;document.querySelector('#totalLoss').textContent=amount(data.totalLossQuote);const accounts=Array.isArray(data.accounts)?data.accounts:[];document.querySelector('#accounts').innerHTML=accounts.length?accounts.map(accountHtml).join(''):'<div class="account muted">暂无账户</div>';document.querySelector('#updated').textContent=`UTC 日期 ${data.date||'—'} · 每 10 秒刷新 · 上次更新 ${new Date(data.updatedAtMs||Date.now()).toLocaleTimeString('zh-CN')}`}
async function load(){try{const r=await fetch('/api/accounts/stats/today',{cache:'no-store'});if(r.status===401){location='/login.html';return}if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){document.querySelector('#updated').innerHTML=`<span class="error">读取失败：${esc(e.message)}，将自动重试</span>`}}
load();setInterval(load,10000);
</script></body></html>
