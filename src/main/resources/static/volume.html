<style>
:root{color-scheme:dark}body{font-family:system-ui,-apple-system,sans-serif;max-width:1320px;margin:28px auto;padding:0 18px;background:#101827;color:#e5e7eb}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}a{color:#93c5fd}button{padding:9px 13px;border:0;border-radius:7px;font-size:14px;cursor:pointer;background:#334155;color:#fff}.muted{color:#a5b4c7;font-size:14px}section{background:#172033;border:1px solid #28364e;border-radius:10px;padding:16px;margin-top:14px;overflow:auto}.ok{color:#4ade80}.bad{color:#fb7185}h1{font-size:23px}h2{font-size:16px;margin:0 0 12px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px;border-bottom:1px solid #28364e;text-align:left;font-size:13px}th{color:#9aabc2;font-weight:500}.empty{color:#9aabc2;padding:16px 0}.error{color:#fb7185}.filters{display:flex;align-items:center;gap:10px;margin:12px 0 14px;flex-wrap:wrap}.flabel{color:#cbd5e1;font-size:14px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 11px;border:1px solid #3b4b66;border-radius:999px;background:#101827;color:#cbd5e1;font-size:13px;cursor:pointer}.chip.on{background:#2563eb;border-color:#2563eb;color:#fff}.mini{padding:6px 11px;font-size:13px}

<body data-page-node-id="vEUD69iBGYA4EG6op4oGmj"><div class="head" data-page-node-id="bQjaQFYxh4jH6XzjT0QqZJ"><div data-page-node-id="ZUgG3tDIzyTP7g9BxmfXh7"><h1 data-page-node-id="xSqbfsCmh3jx7e20WxuwqC">API 账户近 10 天成交量汇总</h1><div id="updated" class="muted" data-page-node-id="ptAil1610v9PBMD6imJEZa">正在加载…</div></div><p data-page-node-id="DYxHBWEIkK7z5XKh2HxVqn"><a href="/dashboard.html" data-page-node-id="VPmmu7J96GupQHKIGruyTF">返回控制台</a> <a href="/today.html" data-page-node-id="4mJCjQ5AWBFm0K0KcReCns">今日账户汇总</a> <a href="/fills.html" data-page-node-id="LIOKIDLmq2EJRUR3hElb8l">成交明细查询</a> <a href="/losses.html">亏损卖出记录</a> <button onclick="load()" data-page-node-id="e4Ob9IWhZHTm4ZIooC8MBu">立即刷新</button></p></div>
<section data-page-node-id="kHQ2VQF4qG6FES160u8ZbN"><h2 data-page-node-id="IKeyrG4KFonYXGZnWZwFAA">按 API 账户 + 交易对汇总（UTC）</h2><p class="muted" data-page-node-id="4VyKnGNjXNCsrDxHjyGGgn">仅显示近 10 天有真实成交的账户/交易对组合；每个交易对单独一行。币种可多选，一个都不选表示全部币种。页面只显示账户别名和 ID，不显示 API Key 或 Secret。</p><div class="filters" data-page-node-id="APyfUGHkOvNzcDZvw0lseR"><span class="flabel" data-page-node-id="XDK66cheRSt7tptscwZ5dz">币种</span><div id="symbolChips" class="chips" data-page-node-id="DkCcfhKqJZsowsxlX0UhaC"></div><button class="mini" onclick="clearSymbols()" data-page-node-id="38rLARIlM5qgi6dtwGBIyA">全部币种</button><button class="mini" onclick="selectAllSymbols()" data-page-node-id="Ck28FO1aBZlxh8AOgamtMY">全选</button><span id="selInfo" class="muted" data-page-node-id="EBwFnBFWnNjUQ2j7M006VU"></span></div><table data-page-node-id="xqCaQcXDE1hCgwkTcnxdc7"><thead data-page-node-id="oGM9cVYgspLk03ukrZGtnT"><tr data-page-node-id="nxzHNpRhLLpTzsDty1ra6S"><th data-page-node-id="wuiCfpn5IOVnJRtbml3YYo">API 账户</th><th data-page-node-id="gVGIPiuEyiawQN6qGudJ3T">交易对</th><th data-page-node-id="biOdDDWmDZSBGbRodLnquy">买入成交量（USDT）</th><th data-page-node-id="8NJqQE7mzrGNNE1j0SSzIY">卖出成交量（USDT）</th><th data-page-node-id="8cjDwSCwY4DLZdWgy2Te8E">总成交量（USDT）</th><th data-page-node-id="mflrmhCQnk6FooEtDcLqds">手续费（USDT）</th><th data-page-node-id="n32cB0omW63PKTUVvs5xTa">手续费（BNB）</th><th data-page-node-id="agFmscShjyMqnmNeN9gUtQ">净实现盈亏（USDT）</th><th data-page-node-id="29gn1w5V1UHYhKmLtr9H4w">成交笔数</th></tr></thead><tbody id="rows" data-page-node-id="32QmJ4Ki9BMwsfxwQ2U1ss"></tbody></table></section>
<script>
const n=v=>v===null||v===undefined?'—':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:8});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let summaries=[],symbols=[],selected=new Set();
function syncSymbols(){symbols=[...new Set(summaries.map(s=>s.symbol).filter(Boolean))].sort((a,b)=>a.localeCompare(b));[...selected].forEach(s=>{if(!symbols.includes(s))selected.delete(s)});renderChips()}
function renderChips(){document.querySelector('#symbolChips').innerHTML=symbols.length?symbols.map(s=>`<button class="chip${selected.has(s)?' on':''}" onclick="toggleSymbol('${esc(s)}')">${esc(s)}</button>`).join(''):'<span class="muted">近 10 天暂无成交</span>';document.querySelector('#selInfo').textContent=selected.size?`已选 ${selected.size} 个币种`:'未筛选（全部币种）'}
function toggleSymbol(s){if(selected.has(s))selected.delete(s);else selected.add(s);renderChips();render()}
function clearSymbols(){selected.clear();renderChips();render()}
function selectAllSymbols(){symbols.forEach(s=>selected.add(s));renderChips();render()}
function render(){const rows=selected.size?summaries.filter(s=>selected.has(s.symbol)):summaries;document.querySelector('#rows').innerHTML=rows.length?rows.map(s=>`<tr><td>${esc(s.accountAlias)}<br><span class="muted">${esc(s.accountId)}</span></td><td>${esc(s.symbol)}</td><td>${n(s.buyVolumeQuote)}</td><td>${n(s.sellVolumeQuote)}</td><td>${n(s.totalVolumeQuote)}</td><td>${n(s.totalCommissionQuoteEquivalent)}</td><td>${n(s.totalCommissionBnb)}</td><td class="${Number(s.netRealizedPnlQuote)<0?'bad':'ok'}">${n(s.netRealizedPnlQuote)}</td><td>${n(s.tradeCount)}</td></tr>`).join(''):`<tr><td colspan="9" class="empty">${selected.size?'所选币种近 10 天暂无成交记录':'近 10 天暂无成交记录'}</td></tr>`}
async function load(){try{const r=await fetch('/api/accounts/stats/summary?days=10',{cache:'no-store'});if(r.status===401){location='/login.html';return}if(!r.ok)throw Error(r.status);summaries=await r.json();syncSymbols();render();document.querySelector('#updated').textContent=`自动刷新：每 10 秒一次 · 上次更新 ${new Date().toLocaleTimeString('zh-CN')}`}catch(e){document.querySelector('#updated').innerHTML=`<span class="error">读取失败：${esc(e.message)}，将自动重试</span>`}}load();setInterval(load,10000);
</script></body></html>
