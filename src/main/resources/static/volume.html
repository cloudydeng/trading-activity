<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API 账户成交量汇总 - Trading Activity</title>
<style>
:root{color-scheme:dark}body{font-family:system-ui,-apple-system,sans-serif;max-width:1320px;margin:28px auto;padding:0 18px;background:#101827;color:#e5e7eb}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}a{color:#93c5fd}button{padding:9px 13px;border:0;border-radius:7px;font-size:14px;cursor:pointer;background:#334155;color:#fff}.muted{color:#a5b4c7;font-size:14px}.card,section{background:#172033;border:1px solid #28364e;border-radius:10px;padding:16px}section{margin-top:14px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:18px 0}.label{color:#9aabc2;font-size:13px}.value{font-size:21px;font-weight:650;margin-top:6px}.ok{color:#4ade80}.bad{color:#fb7185}h1{font-size:23px}h2{font-size:16px;margin:0 0 12px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:10px;border-bottom:1px solid #28364e;text-align:left;font-size:13px}th{color:#9aabc2;font-weight:500}.empty{color:#9aabc2;padding:16px 0}.error{color:#fb7185}
</style></head>
<body><div class="head"><div><h1>API 账户近 10 天成交量汇总</h1><div id="updated" class="muted">正在加载…</div></div><p><a href="/dashboard.html">返回控制台</a> <button onclick="load()">立即刷新</button></p></div>
<section><h2>按 API 账户 + 交易对汇总（UTC）</h2><p class="muted">仅显示近 10 天有真实成交的账户/交易对组合；每个交易对单独一行。页面只显示账户别名和 ID，不显示 API Key 或 Secret。</p><table><thead><tr><th>API 账户</th><th>交易对</th><th>买入成交量（USDT）</th><th>卖出成交量（USDT）</th><th>总成交量（USDT）</th><th>手续费（USDT）</th><th>净实现盈亏（USDT）</th><th>成交笔数</th><th>每百万成交量成本</th></tr></thead><tbody id="rows"></tbody></table></section>
<script>
const n=v=>v===null||v===undefined?'—':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:8});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch('/api/accounts/stats/summary?days=10',{cache:'no-store'});if(r.status===401){location='/login.html';return}if(!r.ok)throw Error(r.status);const rows=await r.json();document.querySelector('#rows').innerHTML=rows.length?rows.map(s=>`<tr><td>${esc(s.accountAlias)}<br><span class="muted">${esc(s.accountId)}</span></td><td>${esc(s.symbol)}</td><td>${n(s.buyVolumeQuote)}</td><td>${n(s.sellVolumeQuote)}</td><td>${n(s.totalVolumeQuote)}</td><td>${n(s.totalCommissionQuoteEquivalent)}</td><td class="${Number(s.netRealizedPnlQuote)<0?'bad':'ok'}">${n(s.netRealizedPnlQuote)}</td><td>${n(s.tradeCount)}</td><td>${s.costPerMillionVolume===null?'待换算':n(s.costPerMillionVolume)}</td></tr>`).join(''):'<tr><td colspan="9" class="empty">近 10 天暂无成交记录</td></tr>';document.querySelector('#updated').textContent=`自动刷新：每 10 秒一次 · 上次更新 ${new Date().toLocaleTimeString('zh-CN')}`}catch(e){document.querySelector('#updated').innerHTML=`<span class="error">读取失败：${esc(e.message)}，将自动重试</span>`}}load();setInterval(load,10000);
</script></body></html>
